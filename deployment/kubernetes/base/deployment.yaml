apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-cost-analyzer
  namespace: finops-analyzer
  labels:
    app: cloud-cost-analyzer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-cost-analyzer
  template:
    metadata:
      labels:
        app: cloud-cost-analyzer
    spec:
      containers:
        - name: cloud-cost-analyzer
          image: devopstrio/cloud-cost-analyzer:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: analyzer-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
